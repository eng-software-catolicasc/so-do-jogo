<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrada do Grupo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061018;color:#eef7ff;font-family:system-ui}.box{width:min(560px,92vw);padding:32px;border:1px solid #23455c;border-radius:22px;background:linear-gradient(145deg,#0b1c28,#07121c);text-align:center;box-shadow:0 20px 60px #0008}.logo{font-weight:950;font-size:30px;letter-spacing:.05em}.sub{color:#9fb1bf;margin:8px 0 24px}.group{display:inline-block;border:1px solid #28a8ff;color:#8bd2ff;border-radius:999px;padding:8px 16px;font-weight:900;letter-spacing:.12em}.qr{width:220px;height:220px;margin:24px auto 10px;background:#fff;border-radius:14px;padding:10px;display:block}.go{display:inline-block;margin-top:18px;padding:12px 18px;border:1px solid #28a8ff;border-radius:999px;color:#8bd2ff;text-decoration:none;font-weight:900}.hint{font-size:12px;color:#718795;margin-top:14px}</style></head><body><main class="box"><div class="logo">ÉTICA NA INTELIGÊNCIA ARTIFICIAL</div><div class="sub">Ambiente da equipe</div><div class="group" id="group">IDENTIFICANDO…</div><img class="qr" id="qr" alt="QR Code deste grupo"><div><a class="go" id="go" href="#">ENTRAR NOS DECKS →</a></div><div class="hint">Este QR identifica esta mesa. Use o mesmo acesso nos dois encontros.</div></main><script>const token=new URLSearchParams(location.search).get('token');if(token){localStorage.setItem('group_token',token);fetch('/api/me',{headers:{'X-Group-Token':token}}).then(r=>r.json()).then(x=>{if(x.group){group.textContent=x.group;qr.src='/api/group/qr?token='+encodeURIComponent(token);go.href='/index.html?token='+encodeURIComponent(token)}else group.textContent='ACESSO INVÁLIDO'}).catch(()=>group.textContent='ERRO AO IDENTIFICAR')}else group.textContent='ACESSO INVÁLIDO';</script></body></html>

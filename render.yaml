services:
  - type: web
    name: baralho-etica-ia
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 26.5.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        value: professor
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: baralho-data
      mountPath: /var/data
      sizeGB: 1
